<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои ссылки</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            
            /* Фоновая картинка */
            background-image: url('HTX_bJxWcAApO09.jpg');
            
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            
            color: #111; /* Темный цвет текста для светлых стеклянных кнопок */
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
            background: transparent;
            padding: 20px;
        }

        h1 {
            font-size: 1.8rem;
            margin: 0 0 6px 0;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        p {
            color: #f1f5f9;
            font-size: 1rem;
            margin: 0 0 32px 0;
            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
            font-weight: 300;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center; /* Центрируем текст (можно поменять на space-between, если будут иконки) */
            
            /* Эффект матового стекла: белый фон с прозрачностью ~35% */
            background-color: rgba(255, 255, 255, 0.35); 
            
            color: #111; /* Темный читаемый текст */
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 14px; /* Плавные скругления, как на картинке */
            font-weight: 500;
            font-size: 1.05rem;
            
            /* Размытие фона позади кнопки (работает в Safari, Chrome, Edge) */
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            
            transition: background 0.2s, transform 0.1s;
            border: 1px solid rgba(255, 255, 255, 0.4); /* Тонкая светлая граница для объема */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .btn:hover {
            background-color: rgba(255, 255, 255, 0.5); /* При наведении становятся чуть менее прозрачными */
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Shinaryen</h1>
        <p>enjoy me</p>

        <div class="links">
            <a href="private.html" class="btn">🔒 VIP / Private</a>
            <a href="https://instagram.com/shinaryen_" class="btn" target="_blank">Instagram</a>
            <a href="https://x.com/shinaryen_real" class="btn" target="_blank">X.com / Twitter</a>
            <a href="https://x.com/softytania" class="btn" target="_blank">My second X</a>
        </div>
    </div>

</body>
</html>
