<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои ссылки</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            
            /* Чистая фоновая картинка */
            background-image: url('HTX_bJxWcAApO09.jpg');
            
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            
            color: #f8fafc;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
            /* Убран фон и размытие у контейнера */
            background: transparent;
            padding: 30px;
        }

        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 16px;
            border: 2px solid #38bdf8;
        }
        h1 {
            font-size: 1.35rem;
            margin: 0 0 8px 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }
        p {
            color: #cbd5e1;
            font-size: 0.95rem;
            margin: 0 0 28px 0;
            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .btn {
            display: block;
            background-color: rgba(30, 41, 59, 0.85); /* Полупрозрачный темный фон кнопок */
            color: #f8fafc;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 12px;
            font-weight: 500;
            transition: background 0.2s, transform 0.1s;
            /* Убрана рамка (border) */
            border: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        .btn:hover {
            background-color: rgba(51, 65, 85, 0.95);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Ваше фото или аватарка -->
        <img src="https://via.placeholder.com/96" alt="Avatar" class="avatar">
        
        <h1>Имя Фамилия</h1>
        <p>Краткое описание или слоган для вашей страницы</p>

        <div class="links">
            <a href="https://t.hamed" class="btn" target="_blank">Telegram канал</a>
            <a href="https://instagram.com" class="btn" target="_blank">Instagram</a>
            <a href="https://youtube.com" class="btn" target="_blank">YouTube канал</a>
            <a href="https://example.com" class="btn" target="_blank">Мой сайт / Портфолио</a>
        </div>
    </div>

</body>
</html>
