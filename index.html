<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои ссылки</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            
            /* Фоновая картинка */
            background-image: url('HTX_bJxWcAApO09.jpg');
            
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            
            color: #f8fafc;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
            background: transparent;
            padding: 30px;
            /* Добавил небольшой отступ сверху, так как убрали аватарку */
            margin-top: -50px; 
        }

        /* Стили для h1 (теперь первый элемент) */
        h1 {
            font-size: 2rem; /* Сделали имя чуть побольше для солидности */
            margin: 0 0 10px 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.7);
        }

        /* Стили для описания */
        p {
            color: #f1f5f9;
            font-size: 1.1rem;
            margin: 0 0 40px 0; /* Увеличили отступ перед кнопками */
            text-shadow: 0 1px 3px rgba(0,0,0,0.7);
            font-weight: 300;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 16px; /* Чуть увеличили расстояние между кнопками */
        }

        .btn {
            display: block;
            /* Полупрозрачный темный фон кнопок */
            background-color: rgba(15, 23, 42, 0.7); 
            color: #f8fafc;
            text-decoration: none;
            padding: 18px 20px; /* Сделали кнопки повыше */
            border-radius: 16px; /* Более скругленные углы */
            font-weight: 500;
            font-size: 1.1rem;
            transition: background 0.3s, transform 0.1s;
            border: 1px solid rgba(255, 255, 255, 0.1); /* Едва заметная рамка для стиля */
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(5px); /* Легкое размытие фона за кнопкой */
        }

        .btn:hover {
            background-color: rgba(30, 41, 59, 0.8);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Аватарка удалена -->
        
        <h1>Имя Фамилия</h1>
        <p>Краткое описание или слоган</p>

        <div class="links">
            <a href="https://t.hamed" class="btn" target="_blank">Telegram канал</a>
            <a href="https://instagram.com" class="btn" target="_blank">Instagram</a>
            <a href="https://youtube.com" class="btn" target="_blank">YouTube канал</a>
            <a href="https://example.com" class="btn" target="_blank">Мой сайт / Портфолио</a>
        </div>
    </div>

</body>
</html>
